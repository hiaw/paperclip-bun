name: Build Custom Paperclip Image

on:
  schedule:
    - cron: '0 4 * * *' # Check every day at 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check latest Paperclip release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GHCR_OWNER: ${{ github.repository_owner }}
        run: |
          upstream_tag=$(gh api repos/paperclipai/paperclip/releases/latest --jq .tag_name)
          if [ -z "$upstream_tag" ]; then
            echo "Could not determine the latest Paperclip release tag." >&2
            exit 1
          fi
          echo "Latest upstream tag is: $upstream_tag"
          echo "tag=$upstream_tag" >> "$GITHUB_OUTPUT"

          # Paperclip's release tags start with v, while its GHCR semver tags do not.
          image_tag=${upstream_tag#v}
          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"

          owner=$(printf '%s' "$GHCR_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "owner=$owner" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Check whether this release is already built
        id: check
        env:
          OWNER: ${{ steps.release.outputs.owner }}
          UPSTREAM_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if docker manifest inspect "ghcr.io/$OWNER/paperclip-bun:$UPSTREAM_TAG" > /dev/null 2>&1; then
            echo "Image for $UPSTREAM_TAG already exists. Skipping build."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "New release detected. Proceeding with build."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.check.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        if: steps.check.outputs.should_build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          pull: true
          build-args: |
            PAPERCLIP_TAG=${{ steps.release.outputs.image_tag }}
          tags: |
            ghcr.io/${{ steps.release.outputs.owner }}/paperclip-bun:latest
            ghcr.io/${{ steps.release.outputs.owner }}/paperclip-bun:${{ steps.release.outputs.tag }}
